<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/typography.css"><link rel="stylesheet" href="css/header.css"><script id="lcs-auth">
/* LCS tài khoản (dùng chung mọi trang).
   Hai chế độ, tự chọn:
   1) MÁY CHỦ (mở qua http://localhost sau khi chạy "node server.js"): tài khoản và người thân lưu ở file
      data/accounts.lcsdb, mã hóa AES-256-GCM, mật khẩu băm scrypt. Trình duyệt chỉ giữ cookie phiên HttpOnly.
   2) TRÌNH DUYỆT (mở trực tiếp file HTML): trình duyệt không cho trang ghi file ra ổ đĩa, nên tạm lưu trong
      localStorage của máy này, mật khẩu băm PBKDF2-SHA256 có muối. Chỉ dùng để trình diễn. */
(function () {
  "use strict";
  var KA = "lcs_accounts", KS = "lcs_session", KC = "lcs_srv_user", TTL = 8 * 3600 * 1000, ITER = 120000;
  var ROLE = { citizen: "Người dân", volunteer: "Đội tình nguyện", reviewer: "Cán bộ kiểm duyệt" };
  var SEED = [
    { username: "canbo.demo", name: "Cán bộ Đoàn (demo)", role: "reviewer" },
    { username: "tinhnguyen.demo", name: "Tình nguyện viên (demo)", role: "volunteer" }
  ];
  var DEMO_PW = "LaChanSo@2026";
  var SERVER = /^https?:$/.test(location.protocol);   // sẽ tắt nếu không có máy chủ Lá Chắn Số
  var srv = { user: null, contacts: [], ready: false };
  try { srv.user = JSON.parse(sessionStorage.getItem(KC)) || null; } catch (e) {}
  function read(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function b64(buf) { var s = "", a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function salt() { var a = new Uint8Array(16); crypto.getRandomValues(a); return b64(a); }
  function needCrypto() { if (!(window.crypto && crypto.subtle)) throw new Error("Trình duyệt chưa hỗ trợ mã hóa mật khẩu. Hãy mở bằng Chrome hoặc Edge bản mới."); }
  async function hash(pw, s) {
    needCrypto();
    var key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return b64(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: unb64(s), iterations: ITER }, key, 256));
  }
  function same(a, b) { if (a.length !== b.length) return false; var r = 0; for (var i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i); return r === 0; }
  var norm = function (u) { return String(u || "").trim().toLowerCase(); };
  function pub(a) { return a ? { username: a.username, name: a.name, role: a.role, roleLabel: ROLE[a.role] || a.role, staff: a.role !== "citizen" } : null; }

  /* ---------- Chế độ máy chủ ---------- */
  async function call(method, route, data) {
    var r;
    try { r = await fetch("/api/lcs/" + route, { method: method, credentials: "same-origin", cache: "no-store", headers: data ? { "Content-Type": "application/json" } : {}, body: data ? JSON.stringify(data) : undefined }); }
    catch (e) { throw new Error("Không kết nối được máy chủ Lá Chắn Số. Kiểm tra cửa sổ đang chạy server.js."); }
    var j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { var err = new Error((j && j.message) || "Máy chủ không xử lý được yêu cầu."); if (j && j.fields) err.fields = j.fields; err.status = r.status; throw err; }
    return j || {};
  }
  function setSrv(user, contacts) {
    srv.user = user || null; srv.contacts = Array.isArray(contacts) ? contacts : [];
    try { user ? sessionStorage.setItem(KC, JSON.stringify(user)) : sessionStorage.removeItem(KC); } catch (e) {}
  }
  function probe() {
    return fetch("/api/lcs/session", { credentials: "same-origin", cache: "no-store" }).then(function (r) {
      if (!r.ok) throw 0; return r.json();
    }).then(function (j) {
      if (!j || j.mode !== "server") throw 0;
      setSrv(j.user, j.contacts); srv.ready = true; changed();
    }).catch(function () { SERVER = false; try { sessionStorage.removeItem(KC); } catch (e) {} changed(); });
  }

  /* ---------- Chế độ trình duyệt ---------- */
  async function ensureSeed() {
    var acc = read(KA, {}), ch = false;
    for (var i = 0; i < SEED.length; i++) {
      var s = SEED[i];
      if (!acc[s.username]) { var sl = salt(); acc[s.username] = { username: s.username, name: s.name, role: s.role, salt: sl, hash: await hash(DEMO_PW, sl), seed: true, created: new Date().toISOString() }; ch = true; }
    }
    if (ch) write(KA, acc);
  }
  function localSession() {
    var s = read(KS, null);
    if (!s || !s.username || !(s.exp > Date.now())) return null;
    return pub(read(KA, {})[s.username]);
  }

  /* ---------- Giao diện chung (giữ nguyên cho mọi trang) ---------- */
  function session() { return SERVER ? (srv.user ? pub(srv.user) : null) : localSession(); }
  async function login(username, pw) {
    if (SERVER) { var j = await call("POST", "login", { username: username, password: pw }); setSrv(j.user, j.contacts); changed(); return session(); }
    await ensureSeed();
    var u = norm(username), a = read(KA, {})[u];
    var h = a ? await hash(String(pw || ""), a.salt) : await hash(String(pw || ""), salt());
    if (!a || !same(h, a.hash)) throw new Error("Tên đăng nhập hoặc mật khẩu không đúng.");
    if (!write(KS, { username: u, exp: Date.now() + TTL })) throw new Error("Trình duyệt đang chặn lưu dữ liệu nên chưa đăng nhập được.");
    changed(); return session();
  }
  async function register(o) {
    if (SERVER) { var j = await call("POST", "register", { name: o.name, username: o.username, password: o.password, confirm: o.confirm }); setSrv(j.user, j.contacts); changed(); return session(); }
    var name = String(o.name || "").trim(), u = norm(o.username), pw = String(o.password || ""), errors = {};
    if (name.length < 2 || name.length > 50) errors.name = "Tên hiển thị từ 2 đến 50 ký tự.";
    if (!/^[a-z0-9._]{4,30}$/.test(u)) errors.username = "Tên đăng nhập 4–30 ký tự, chỉ gồm chữ không dấu, số, dấu chấm hoặc gạch dưới.";
    if (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) errors.password = "Mật khẩu tối thiểu 8 ký tự, có cả chữ và số.";
    if (pw !== String(o.confirm || "")) errors.confirm = "Mật khẩu nhập lại chưa khớp.";
    await ensureSeed();
    var acc = read(KA, {});
    if (!errors.username && acc[u]) errors.username = "Tên đăng nhập này đã có người dùng.";
    if (Object.keys(errors).length) { var e = new Error("Vui lòng kiểm tra lại thông tin."); e.fields = errors; throw e; }
    var sl = salt();
    acc[u] = { username: u, name: name, role: "citizen", salt: sl, hash: await hash(pw, sl), created: new Date().toISOString() };
    if (!write(KA, acc)) throw new Error("Trình duyệt đang chặn lưu dữ liệu nên chưa tạo được tài khoản.");
    write(KS, { username: u, exp: Date.now() + TTL });
    changed(); return session();
  }
  function logout() {
    if (SERVER) { setSrv(null, []); call("POST", "logout", {}).catch(function () {}); changed(); return; }
    try { localStorage.removeItem(KS); } catch (e) {} changed();
  }
  function contacts() {
    var s = session(); if (!s) return [];
    if (SERVER) return srv.contacts.map(function (c) { return { name: c.name, phone: c.phone, preferred: !!c.preferred }; });
    return read("lcs_contacts:" + s.username, []);
  }
  function saveContacts(list) {
    var s = session(); if (!s) return false;
    list = (list || []).slice(0, 10);
    if (SERVER) {
      srv.contacts = list.map(function (c) { return { name: c.name, phone: c.phone, preferred: !!c.preferred }; });
      call("PUT", "contacts", { contacts: srv.contacts }).then(function (j) { srv.contacts = j.contacts || srv.contacts; })
        .catch(function (e) { if (e.status === 401) { setSrv(null, []); changed(); } try { window.dispatchEvent(new CustomEvent("lcs:save-error", { detail: e.message })); } catch (x) {} });
      return true;
    }
    return write("lcs_contacts:" + s.username, list);
  }
  /* ---------- Báo cáo: mã tra cứu, lịch sử theo tài khoản, kiểm duyệt ----------
     Máy chủ: lưu trong data/accounts.lcsdb (mã hóa). Trình duyệt: localStorage "lcs_reports".
     Chỉ lưu bản băm SHA-256 của mã tra cứu, không lưu mã gốc. */
  var RK = "lcs_reports", ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var STATUS = { PENDING_VERIFICATION: "Chờ xác minh", UNDER_REVIEW: "Đang xác minh", VERIFIED: "Đã xác minh", INSUFFICIENT_EVIDENCE: "Chưa đủ căn cứ", REJECTED: "Bị từ chối" };
  var CATS = { fake_authority: "Giả danh công an / ngân hàng", fake_job: "Việc nhẹ, lương cao", phishing: "Đường dẫn giả mạo", fake_gift: "Nhận quà / trúng thưởng", investment: "Đầu tư / sinh lời", other: "Hình thức khác" };
  function rnd(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); var s = ""; for (var i = 0; i < n; i++) s += ALPHA[a[i] % 32]; return s; }
  function normCode(v) { var c = String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); if (c.indexOf("LCS") === 0) c = c.slice(3); return /^[A-HJ-NP-Z2-9]{12}$/.test(c) ? "LCS-" + c.slice(0, 4) + "-" + c.slice(4, 8) + "-" + c.slice(8) : null; }
  async function sha(t) { needCrypto(); var b = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t))); var h = ""; for (var i = 0; i < b.length; i++) h += ("0" + b[i].toString(16)).slice(-2); return h; }
  function rlist() { var a = read(RK, []); return Array.isArray(a) ? a.filter(function (r) { return r && typeof r.id === "string" && STATUS[r.status] && Array.isArray(r.events); }) : []; }
  function pubR(r) {
    var last = r.events.slice().reverse().find(function (e) { return e.to_status === r.status; });
    return { reference: r.reference, status: r.status, category: r.category, indicator_type: r.indicator_type, created_at: r.created_at, updated_at: r.updated_at,
      reason: r.status === "REJECTED" && last ? last.reason : null, steps: r.events.map(function (e) { return { status: e.to_status, at: e.created_at }; }) };
  }
  var reports = Object.freeze({
    STATUS: STATUS, CATS: CATS, normCode: normCode,
    submit: async function (p) {
      await readyP;
      if (SERVER) return call("POST", "reports", { category: p.category, indicator_type: p.indicator_type, indicator: p.indicator, description: p.description, ward: p.ward });
      var now = new Date(), iso = now.toISOString(), code = normCode(rnd(12)), list = rlist(), me = session();
      var dup = list.some(function (x) { return String(x.indicator || "").toLowerCase() === String(p.indicator).toLowerCase(); });
      var r = { id: "f02-" + Date.now().toString(36) + "-" + rnd(4).toLowerCase(), reference: code, code_hash: await sha(code), owner: me ? me.username : null,
        category: p.category, indicator_type: p.indicator_type, indicator: p.indicator, description: p.description, ward: p.ward, province: "Đồng Nai", status: "PENDING_VERIFICATION", possible_duplicate: dup, created_at: iso, updated_at: iso, has_evidence: false, events: [] };
      list.unshift(r);
      if (!write(RK, list.slice(0, 300))) throw new Error("Trình duyệt đang chặn lưu dữ liệu nên chưa lưu được báo cáo.");
      return { reference: r.reference, code: code, status: r.status, possible_duplicate: dup, owner: r.owner };
    },
    lookup: async function (codeIn) {
      await readyP;
      var code = normCode(codeIn); if (!code) throw new Error("Mã tra cứu gồm 12 ký tự sau chữ LCS, ví dụ LCS-AB2C-D3EF-GH4K.");
      if (SERVER) return (await call("POST", "lookup", { code: code })).report;
      var h = await sha(code), r = rlist().find(function (x) { return x.code_hash === h; });
      if (!r) throw new Error("Không tìm thấy báo cáo với mã này trên trình duyệt này. Kiểm tra lại từng ký tự.");
      return pubR(r);
    },
    mine: async function () {
      await readyP; var me = session(); if (!me) return [];
      if (SERVER) return (await call("GET", "myreports")).reports;
      return rlist().filter(function (x) { return x.owner === me.username; }).map(pubR);
    },
    reviewList: async function () {
      await readyP;
      if (SERVER) return (await call("GET", "review/reports")).reports;
      return rlist().map(function (r) { var x = Object.assign({}, r); delete x.code_hash; x.has_account = !!x.owner; x.reporter = x.owner ? { username: x.owner, name: (read(KA, {})[x.owner] || {}).name || x.owner } : null; delete x.owner; return x; });
    },
    decide: async function (id, b) {
      await readyP;
      if (SERVER) return (await call("POST", "review/decision", { id: id, target: b.target, reason: b.reason, evidence_basis: b.evidence_basis, evidence_checked: !!b.evidence_checked, expected_updated_at: b.expected_updated_at })).report;
      var list = rlist(), r = list.find(function (x) { return x.id === id; }); if (!r) throw new Error("Không tìm thấy hồ sơ.");
      var t = new Date().toISOString(), me = session();
      r.events.push({ actor: me ? me.username : "reviewer-demo", from_status: r.status, to_status: b.target, reason: b.reason, evidence_basis: b.evidence_basis || "", created_at: t });
      r.status = b.target; r.updated_at = t;
      if (!write(RK, list)) throw new Error("Trình duyệt đang chặn lưu dữ liệu.");
      var x = Object.assign({}, r); delete x.code_hash; x.has_account = !!x.owner; x.reporter = x.owner ? { username: x.owner, name: (read(KA, {})[x.owner] || {}).name || x.owner } : null; delete x.owner; return x;
    }
  });
  function mode() { return SERVER ? "server" : "local"; }
  function chip() {
    var s = session();
    document.querySelectorAll("[data-lcs-acct]").forEach(function (a) {
      var t = a.querySelector(".lcs-acct-t");
      if (t) t.textContent = s ? s.name : "Tài khoản";
      a.classList.toggle("in", !!s);
      a.setAttribute("aria-label", s ? "Tài khoản: " + s.name + " (" + (ROLE[s.role] || "") + ")" : "Đăng nhập hoặc tạo tài khoản");
      a.title = s ? s.name + " · " + (ROLE[s.role] || "") : "Tài khoản: đăng nhập hoặc tạo mới";
    });
  }
  function changed() { chip(); try { window.dispatchEvent(new CustomEvent("lcs:auth", { detail: session() })); } catch (e) {} }
  window.addEventListener("storage", function (e) { if (!SERVER && (e.key === KS || e.key === KA)) changed(); });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", chip); else chip();
  var readyP = SERVER ? probe() : Promise.resolve();
  window.LCS = Object.freeze({ session: session, login: login, register: register, logout: logout, contacts: contacts, saveContacts: saveContacts, mode: mode, reports: reports, ROLE: ROLE, SEED: SEED, DEMO_PW: DEMO_PW });
})();
</script>

/* Lá Chắn Số - F04 - Học 1 phút. Tách từ F04_F05_F07_Demo.html. */
const START="F04";
const LESSONS=(window.LCS_DATA&&window.LCS_DATA.lessons)||[];
const LCS_RAND=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=LCS_RAND(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const mixQ=q=>{const o=shuffle(q.options.map((_,i)=>i));return {...q,options:o.map(i=>q.options[i]),correct:o.indexOf(q.correct)}};
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',book:'<path d="M12 6v15M3 4h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5v16h-5a4 4 0 0 0-4 2 4 4 0 0 0-4-2H3Z"/>',quiz:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10l1 1 3-3m-4 8 1 1 3-3m2-4h2m-2 6h2"/>',scan:'<path d="M4 8V4h4m8 0h4v4M4 16v4h4m8 0h4v-4M4 12h16"/>',phone:'<path d="M21 16v3a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2h3l2 5-2 2a14 14 0 0 0 6 6l2-2Z"/>',bank:'<path d="m3 8 9-5 9 5M4 9h16M6 9v9m6-9v9m6-9v9M3 21h18"/>',briefcase:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 12h18m-11 0v3h4v-3"/>',gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13m0-13C3 8 6 0 12 8c6-8 9 0 0 0"/>',package:'<path d="m3 7 9-5 9 5v10l-9 5-9-5ZM3 7l9 5 9-5m-9 5v10M7.5 4.5l9 5"/>',chart:'<path d="M3 3v18h18M7 17v-5m5 5V9m5 8V5"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3m3-15a3 3 0 0 1 0 6m4 9v-3a5 5 0 0 0-4-5"/>',lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/>',cart:'<path d="M2 3h3l3 12h11l3-9H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',chev:'<path d="m9 18 6-6-6-6"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="m5 12 4 4L19 6"/>',x:'<path d="m6 6 12 12M18 6 6 18"/>',alert:'<path d="M10.3 4.6 2.5 18a2 2 0 0 0 1.8 3h15.4a2 2 0 0 0 1.8-3L13.7 4.6a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 4h.01"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',speaker:'<path d="M3 9h4l5-4v14l-5-4H3zM16 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/>',trophy:'<path d="M8 3h8v7a4 4 0 0 1-8 0V3m0 1H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4m-4 3v6m-5 1h10"/>',flag:'<path d="M4 22V4c4-3 8 3 12 0l4-1v12l-4 1c-4 3-8-3-12 0"/>',paste:'<rect x="6" y="6" width="15" height="15" rx="2"/><path d="M3 16V3h13"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5m11 0a8 8 0 0 0-14-5m-2 5a8 8 0 0 0 14 5"/>'};
const ic=n=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[n]||paths.info}</svg>`;
const button=(action,label,cls='secondary',attrs='')=>`<button type="button" class="${cls}" data-action="${action}" ${attrs}>${label}</button>`;
const notice=(text,tone='')=>`<div class="notice ${tone}">${ic(tone==='warn'||tone==='bad'?'alert':tone==='good'?'check':'info')}<span>${text}</span></div>`;
const progress=(n,t)=>`<div class="progress" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${t}" aria-label="Tiến độ"><span style="width:${n/t*100}%"></span></div>`;
const lessonById=id=>LESSONS.find(x=>x.id===id);
/* Mỗi lần mở trang chỉ lấy ngẫu nhiên vài bài từ bộ dữ liệu */
const PER_SESSION=6;let SHOWN=shuffle(LESSONS).slice(0,PER_SESSION);
let current=START,screen='',large=false;const app=$('#app');
const S={lessonId:null,lessonAnswer:null,lessonSelected:null,completed:new Set(),quiz:null,quizSelected:null,message:'',msgError:'',result:null,sample:null,ai:false,consent:false,request:0,reportText:'',reportConsent:false,reportError:'',provider:false,reportRoute:false};
const connected=location.protocol==='http:'||location.protocol==='https:';
function go(mod,next,focus=true){S.request++;stopSpeech();current=mod;screen=next;render(focus)}
function start(mod){if(mod==='F04')go(mod,'library');if(mod==='F05')go(mod,S.quiz?(S.quiz.done?'score':'question'):'intro');if(mod==='F07')go(mod,'input')}
function render(focus=false){document.querySelectorAll('nav button').forEach(b=>{const active=b.dataset.module===current;b.classList.toggle('active',active);active?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});app.innerHTML=(current==='F04'?view04():current==='F05'?view05():view07())+'<div class="footer">Lá Chắn Số · MVP Hackathon · Tình huống giáo dục giả lập, không phải kết luận pháp lý.</div>';if(focus){app.focus({preventScroll:true});window.scrollTo(0,0)}}
function stopSpeech(){try{window.speechSynthesis?.cancel()}catch{}}
function speak(text){const out=$('#speech-status');if(!out)return;try{if(!window.speechSynthesis)throw Error();if(speechSynthesis.speaking){stopSpeech();out.textContent='Đã dừng đọc.';return}const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('vi'));if(!v)throw Error();const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.voice=v;u.rate=.85;u.onend=()=>out.textContent='Đã đọc xong.';u.onerror=()=>out.textContent='Không thể đọc. Hãy xem nội dung bằng chữ.';speechSynthesis.speak(u);out.textContent='Đang đọc. Bấm lại để dừng.'}catch{out.textContent='Thiết bị chưa có giọng tiếng Việt. Hãy đọc nội dung bằng chữ.'}}
function choices(q,chosen,locked,action){return q.options.map((o,i)=>{const tone=locked?(i===q.correct?'correct':i===chosen?'wrong':''):'';return `<button class="choice ${tone}" data-action="${action}" data-index="${i}" aria-pressed="${chosen===i}" ${locked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span>${locked&&i===q.correct?ic('check'):locked&&i===chosen?ic('x'):''}</button>`}).join('')}
function feedback(q,a){return `<div class="feedback ${a===q.correct?'good':'bad'}" role="status"><h3>${ic(a===q.correct?'check':'info')}${a===q.correct?'Chính xác!':'Chưa chính xác'}</h3><p>${esc(q.explanation)}</p></div>`}
app.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;await ACT(a,b)});
app.addEventListener('input',e=>{if(e.target.id==='message'){S.message=e.target.value;S.sample=null;S.msgError='';S.consent=false;S.result=null;$('#msg-count').textContent=`${S.message.length}/2000`;$('#msg-error')?.remove();e.target.setAttribute('aria-invalid','false');const p=$('#redacted-preview');if(p)p.textContent=redact(S.message);const c=$('#ai-consent');if(c)c.checked=false}if(e.target.id==='redacted-preview'){S.consent=false;const c=$('#ai-consent');if(c)c.checked=false}if(e.target.id==='report-text'){S.reportText=e.target.value;S.reportConsent=false;const c=$('#report-consent');if(c)c.checked=false}});
app.addEventListener('change',e=>{if(e.target.id==='ai-toggle'){S.ai=e.target.checked;S.consent=false;render();$('#ai-toggle')?.focus()}if(e.target.id==='ai-consent')S.consent=e.target.checked;if(e.target.id==='report-consent')S.reportConsent=e.target.checked});
function init(){if(!LESSONS.length){app.innerHTML='<section class="card stack"><h1>Chưa nạp được dữ liệu bài học</h1><p>Hãy giữ thư mục <strong>data</strong> nằm cạnh các file HTML (cần file lessons.js).</p></section>';return}loadCompleted();start(current);initPage();if(connected){fetch('/api/f07/config',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(x=>{if(x){S.provider=x.ai_available===true;S.reportRoute=x.report_route===true;if(current==='F07'&&screen==='input'&&!S.message)render()}}).catch(()=>{})}}
/* Tiến độ bài học lưu chung giữa F04 và F05 */
function loadCompleted(){try{JSON.parse(localStorage.getItem('lcs_completed')||'[]').forEach(id=>{if(lessonById(id))S.completed.add(id)})}catch{}}
function saveCompleted(){try{localStorage.setItem('lcs_completed',JSON.stringify([...S.completed]))}catch{}}
const PAGE={F00:'index.html',F03:'ask-family.html',F01:'quick-check.html',F02:'report.html',F04:'learn.html',F05:'quiz.html',F07:'message-check.html',F08:'check-result.html'};
const goPage=(mod,q='')=>location.assign(PAGE[mod]+q);
const QS=new URLSearchParams(location.search);
function view04(){const l=lessonById(S.lessonId);if(screen==='library'||!l){return `<section class="hero"><div class="copy"><p class="eyebrow">Kỹ năng số</p><h1>Học trong 1 phút</h1><p>Nhận diện các tình huống lừa đảo thường gặp. Đọc theo tốc độ của bạn, không giới hạn thời gian.</p></div><div class="art">${ic('book')}</div></section><div class="card"><div class="between"><div><h2>Hành trình của bạn</h2><p class="sub">${S.completed.size}/${LESSONS.length} bài trong bộ dữ liệu đã củng cố đúng</p></div><span class="pill">${Math.round(S.completed.size/LESSONS.length*100)}%</span></div>${progress(S.completed.size,LESSONS.length)}</div><div class="section"><div class="between"><div><h2>${SHOWN.length} tình huống cho lần học này</h2><span class="small">Chọn ngẫu nhiên từ ${LESSONS.length} bài giả lập · đổi mỗi lần mở trang</span></div>${button('shuffle-lessons',ic('refresh')+' Đổi bài khác','secondary')}</div><div class="grid">${SHOWN.map((x,i)=>`<button class="tile" data-action="lesson" data-id="${x.id}"><span class="tileicon">${ic(x.icon)}</span><span class="txt"><span class="small">Bài ${String(i+1).padStart(2,'0')} · ${esc(x.topic)}</span><strong>${esc(x.title)}</strong><small>${S.completed.has(x.id)?'✓ Đã củng cố đúng':'Khoảng 1 phút'}</small></span>${ic('chev')}</button>`).join('')}</div></div>`}const q=S.lq||l.question;return `<div class="layout"><section class="card stack">${button('library',ic('back')+' Thư viện bài học','quiet back')}<div class="row"><span class="pill">Bài ${SHOWN.indexOf(l)+1}/${SHOWN.length}</span><span class="small">${ic('clock').replace('class="icon"','class="icon" style="width:16px;height:16px;vertical-align:middle"')} Khoảng 1 phút</span></div><div><p class="eyebrow">${esc(l.topic)}</p><h1>${esc(l.title)}</h1></div><div class="notice">${ic(l.icon)}<div><h3>Tình huống giả lập</h3><p>${esc(l.situation)}</p></div></div><div><h2>3 dấu hiệu cần cảnh giác</h2><ol class="steps">${l.signals.map((x,i)=>`<li><span class="num">${i+1}</span><p>${esc(x)}</p></li>`).join('')}</ol></div><div class="notice good">${ic('shield')}<div><h3>Cách xử lý an toàn</h3><p>${esc(l.action)}</p></div></div>${button('listen',ic('speaker')+' Nghe hướng dẫn','secondary full')}<div id="speech-status" class="small" role="status"></div><div><p class="eyebrow">Câu hỏi củng cố</p><p class="question">${esc(q.text)}</p><div class="stack">${choices(q,S.lessonSelected,S.lessonAnswer!==null,'lesson-select')}</div></div>${S.lessonAnswer===null?button('lesson-submit','Kiểm tra câu trả lời','primary full',S.lessonSelected===null?'disabled':''):feedback(q,S.lessonAnswer)}${S.lessonAnswer!==null?`<div class="cta">${S.lessonAnswer!==q.correct?button('lesson-retry','Thử lại','secondary'):button('lesson-next','Bài tiếp theo '+ic('arrow'),'secondary')}${button('quiz-from-lesson','Luyện quiz '+ic('arrow'),'primary')}</div>`:''}</section><aside class="stack"><section class="card"><h2>Ghi nhớ 3 không</h2><ol class="steps"><li><span class="num">1</span><p>Không vội chuyển tiền.</p></li><li><span class="num">2</span><p>Không chia sẻ OTP.</p></li><li><span class="num">3</span><p>Không bấm link lạ.</p></li></ol></section><section class="card"><h2>Đọc theo tốc độ của bạn</h2><p class="sub">Không có đồng hồ đếm ngược. Bật chữ lớn ở đầu trang nếu cần.</p></section></aside></div>`}
function openLesson(id){if(!lessonById(id)){go('F04','library');return}S.lessonId=id;S.lq=mixQ(lessonById(id).question);if(!SHOWN.some(x=>x.id===id))SHOWN=[lessonById(id),...SHOWN.filter(x=>x.id!==id).slice(0,PER_SESSION-1)];S.lessonAnswer=null;S.lessonSelected=null;go('F04','lesson')}
function act04(a,b){const l=lessonById(S.lessonId);switch(a){case 'lesson':openLesson(b.dataset.id);break;case 'library':go('F04','library');break;case 'shuffle-lessons':SHOWN=shuffle(LESSONS).slice(0,PER_SESSION);go('F04','library');break;case 'listen':if(l)speak([l.title,l.situation,...l.signals,l.action].join('. '));break;case 'lesson-select':if(S.lessonAnswer===null){S.lessonSelected=+b.dataset.index;render();app.querySelector(`[data-action="lesson-select"][data-index="${S.lessonSelected}"]`)?.focus()}break;case 'lesson-submit':if(l&&S.lessonAnswer===null&&S.lessonSelected!==null){S.lessonAnswer=S.lessonSelected;if(S.lessonAnswer===(S.lq||l.question).correct){S.completed.add(l.id);saveCompleted()}render();app.querySelector('.feedback')?.scrollIntoView({block:'nearest'})}break;case 'lesson-retry':S.lq=mixQ(l.question);S.lessonAnswer=null;S.lessonSelected=null;render();break;case 'lesson-next':{const next=SHOWN[SHOWN.indexOf(l)+1];next?openLesson(next.id):go('F04','library');break}case 'quiz-from-lesson':goPage('F05',l?'?lesson='+encodeURIComponent(l.id):'');break}}
function ACT(a,b){return act04(a,b)}
function initPage(){const id=QS.get('lesson');if(id&&lessonById(id))openLesson(id)}
init();
</script>
<!-- LCS cỡ chữ: nút A− / A+ đồng bộ giữa các trang qua localStorage "lcs_font_scale" -->
<link rel="stylesheet" href="css/font-size.css">
<script>
(function () {
  var s = window.__lcsFont || { L: [0.9, 1, 1.15, 1.3], i: 1 };
  var hosts = document.querySelectorAll("[data-lcs-fs]");
  var outs = [], decs = [], incs = [];
  hosts.forEach(function (host) {
    host.innerHTML = '<div class="lcs-fs" role="group" aria-label="Cỡ chữ">' +
      '<button type="button" data-d="-1" aria-label="Giảm cỡ chữ" title="Giảm cỡ chữ"><span class="lcs-fs-small">A</span>−</button>' +
      '<output aria-live="polite"></output>' +
      '<button type="button" data-d="1" aria-label="Tăng cỡ chữ" title="Tăng cỡ chữ">A+</button></div>';
    outs.push(host.querySelector("output"));
    decs.push(host.querySelector('[data-d="-1"]'));
    incs.push(host.querySelector('[data-d="1"]'));
    host.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-d]");
      if (b) set(s.i + Number(b.dataset.d), true);
    });
  });
  function layout() {
    var w = window.innerWidth / s.L[s.i];
    document.documentElement.classList.toggle("lcs-compact", w < 1140 && window.innerWidth >= 851);
    document.documentElement.classList.toggle("lcs-narrow", w < 560);
  }
  function set(i, save) {
    i = Math.max(0, Math.min(s.L.length - 1, i));
    s.i = i;
    document.documentElement.style.zoom = s.L[i];
    outs.forEach(function (o) { o.textContent = Math.round(s.L[i] * 100) + "%"; });
    decs.forEach(function (b) { b.disabled = i === 0; });
    incs.forEach(function (b) { b.disabled = i === s.L.length - 1; });
    if (save) { try { localStorage.setItem("lcs_font_scale", String(s.L[i])); } catch (e) {} }
    layout();
  }
  // Đồng bộ ngay với các tab khác đang mở
  window.addEventListener("storage", function (e) {
    if (e.key === "lcs_font_scale") { var k = s.L.indexOf(parseFloat(e.newValue)); set(k >= 0 ? k : 1, false); }
  });
  window.addEventListener("resize", layout);
  set(s.i, false);
})();
</script>
