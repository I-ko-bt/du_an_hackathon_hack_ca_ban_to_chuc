<script id="lcs-auth">
/* LCS tài khoản (dùng chung mọi trang).
   Hai chế độ, tự chọn:
   1) MÁY CHỦ (mở qua http://localhost sau khi chạy "node server.js"): tài khoản và người thân lưu ở file
      data/accounts.lcsdb, mã hóa AES-256-GCM, mật khẩu băm scrypt. Trình duyệt chỉ giữ cookie phiên HttpOnly.
   2) TRÌNH DUYỆT (mở trực tiếp file HTML): trình duyệt không cho trang ghi file ra ổ đĩa, nên tạm lưu trong
      localStorage của máy này, mật khẩu băm PBKDF2-SHA256 có muối. Chỉ dùng để trình diễn. */
(function () {
  "use strict";
  var KA = "lcs_accounts", KS = "lcs_session", KC = "lcs_srv_user", TTL = 8 * 3600 * 1000, ITER = 120000;
  var ROLE = { citizen: "Người dân", volunteer: "Đội tình nguyện", reviewer: "Cán bộ kiểm duyệt" };
  var SEED = [
    { username: "canbo.demo", name: "Cán bộ Đoàn (demo)", role: "reviewer" },
    { username: "tinhnguyen.demo", name: "Tình nguyện viên (demo)", role: "volunteer" }
  ];
  var DEMO_PW = "LaChanSo@2026";
  var SERVER = /^https?:$/.test(location.protocol);   // sẽ tắt nếu không có máy chủ Lá Chắn Số
  var srv = { user: null, contacts: [], ready: false };
  try { srv.user = JSON.parse(sessionStorage.getItem(KC)) || null; } catch (e) {}
  function read(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function b64(buf) { var s = "", a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function salt() { var a = new Uint8Array(16); crypto.getRandomValues(a); return b64(a); }
  function needCrypto() { if (!(window.crypto && crypto.subtle)) throw new Error("Trình duyệt chưa hỗ trợ mã hóa mật khẩu. Hãy mở bằng Chrome hoặc Edge bản mới."); }
  async function hash(pw, s) {
    needCrypto();
    var key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return b64(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: unb64(s), iterations: ITER }, key, 256));
  }
  function same(a, b) { if (a.length !== b.length) return false; var r = 0; for (var i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i); return r === 0; }
  var norm = function (u) { return String(u || "").trim().toLowerCase(); };
  function pub(a) { return a ? { username: a.username, name: a.name, role: a.role, roleLabel: ROLE[a.role] || a.role, staff: a.role !== "citizen" } : null; }

  /* ---------- Chế độ máy chủ ---------- */
  async function call(method, route, data) {
    var r;
    try { r = await fetch("/api/lcs/" + route, { method: method, credentials: "same-origin", cache: "no-store", headers: data ? { "Content-Type": "application/json" } : {}, body: data ? JSON.stringify(data) : undefined }); }
    catch (e) { throw new Error("Không kết nối được máy chủ Lá Chắn Số. Kiểm tra cửa sổ đang chạy server.js."); }
    var j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { var err = new Error((j && j.message) || "Máy chủ không xử lý được yêu cầu."); if (j && j.fields) err.fields = j.fields; err.status = r.status; throw err; }
    return j || {};
  }
  function setSrv(user, contacts) {
    srv.user = user || null; srv.contacts = Array.isArray(contacts) ? contacts : [];
    try { user ? sessionStorage.setItem(KC, JSON.stringify(user)) : sessionStorage.removeItem(KC); } catch (e) {}
  }
  function probe() {
    return fetch("/api/lcs/session", { credentials: "same-origin", cache: "no-store" }).then(function (r) {
      if (!r.ok) throw 0; return r.json();
    }).then(function (j) {
      if (!j || j.mode !== "server") throw 0;
      setSrv(j.user, j.contacts); srv.ready = true; changed();
    }).catch(function () { SERVER = false; try { sessionStorage.removeItem(KC); } catch (e) {} changed(); });
  }

  /* ---------- Chế độ trình duyệt ---------- */
  async function ensureSeed() {
    var acc = read(KA, {}), ch = false;
    for (var i = 0; i < SEED.length; i++) {
      var s = SEED[i];
      if (!acc[s.username]) { var sl = salt(); acc[s.username] = { username: s.username, name: s.name, role: s.role, salt: sl, hash: await hash(DEMO_PW, sl), seed: true, created: new Date().toISOString() }; ch = true; }
    }
    if (ch) write(KA, acc);
  }
  function localSession() {
    var s = read(KS, null);
    if (!s || !s.username || !(s.exp > Date.now())) return null;
    return pub(read(KA, {})[s.username]);
  }

  /* ---------- Giao diện chung (giữ nguyên cho mọi trang) ---------- */
  function session() { return SERVER ? (srv.user ? pub(srv.user) : null) : localSession(); }
  async function login(username, pw) {
    if (SERVER) { var j = await call("POST", "login", { username: username, password: pw }); setSrv(j.user, j.contacts); changed(); return session(); }
    await ensureSeed();
    var u = norm(username), a = read(KA, {})[u];
    var h = a ? await hash(String(pw || ""), a.salt) : await hash(String(pw || ""), salt());
    if (!a || !same(h, a.hash)) throw new Error("Tên đăng nhập hoặc mật khẩu không đúng.");
    if (!write(KS, { username: u, exp: Date.now() + TTL })) throw new Error("Trình duyệt đang chặn lưu dữ liệu nên chưa đăng nhập được.");
    changed(); return session();
  }
  async function register(o) {
    if (SERVER) { var j = await call("POST", "register", { name: o.name, username: o.username, password: o.password, confirm: o.confirm }); setSrv(j.user, j.contacts); changed(); return session(); }
    var name = String(o.name || "").trim(), u = norm(o.username), pw = String(o.password || ""), errors = {};
    if (name.length < 2 || name.length > 50) errors.name = "Tên hiển thị từ 2 đến 50 ký tự.";
    if (!/^[a-z0-9._]{4,30}$/.test(u)) errors.username = "Tên đăng nhập 4–30 ký tự, chỉ gồm chữ không dấu, số, dấu chấm hoặc gạch dưới.";
    if (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) errors.password = "Mật khẩu tối thiểu 8 ký tự, có cả chữ và số.";
    if (pw !== String(o.confirm || "")) errors.confirm = "Mật khẩu nhập lại chưa khớp.";
    await ensureSeed();
    var acc = read(KA, {});
    if (!errors.username && acc[u]) errors.username = "Tên đăng nhập này đã có người dùng.";
    if (Object.keys(errors).length) { var e = new Error("Vui lòng kiểm tra lại thông tin."); e.fields = errors; throw e; }
    var sl = salt();
    acc[u] = { username: u, name: name, role: "citizen", salt: sl, hash: await hash(pw, sl), created: new Date().toISOString() };
    if (!write(KA, acc)) throw new Error("Trình duyệt đang chặn lưu dữ liệu nên chưa tạo được tài khoản.");
    write(KS, { username: u, exp: Date.now() + TTL });
    changed(); return session();
  }
  function logout() {
    if (SERVER) { setSrv(null, []); call("POST", "logout", {}).catch(function () {}); changed(); return; }
    try { localStorage.removeItem(KS); } catch (e) {} changed();
  }
  function contacts() {
    var s = session(); if (!s) return [];
    if (SERVER) return srv.contacts.map(function (c) { return { name: c.name, phone: c.phone, preferred: !!c.preferred }; });
    return read("lcs_contacts:" + s.username, []);
  }
  function saveContacts(list) {
    var s = session(); if (!s) return false;
    list = (list || []).slice(0, 10);
    if (SERVER) {
      srv.contacts = list.map(function (c) { return { name: c.name, phone: c.phone, preferred: !!c.preferred }; });
      call("PUT", "contacts", { contacts: srv.contacts }).then(function (j) { srv.contacts = j.contacts || srv.contacts; })
        .catch(function (e) { if (e.status === 401) { setSrv(null, []); changed(); } try { window.dispatchEvent(new CustomEvent("lcs:save-error", { detail: e.message })); } catch (x) {} });
      return true;
    }
    return write("lcs_contacts:" + s.username, list);
  }
  /* ---------- Báo cáo: mã tra cứu, lịch sử theo tài khoản, kiểm duyệt ----------
     Máy chủ: lưu trong data/accounts.lcsdb (mã hóa). Trình duyệt: localStorage "lcs_reports".
     Chỉ lưu bản băm SHA-256 của mã tra cứu, không lưu mã gốc. */
  var RK = "lcs_reports", ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var STATUS = { PENDING_VERIFICATION: "Chờ xác minh", UNDER_REVIEW: "Đang xác minh", VERIFIED: "Đã xác minh", INSUFFICIENT_EVIDENCE: "Chưa đủ căn cứ", REJECTED: "Bị từ chối" };
  var CATS = { fake_authority: "Giả danh công an / ngân hàng", fake_job: "Việc nhẹ, lương cao", phishing: "Đường dẫn giả mạo", fake_gift: "Nhận quà / trúng thưởng", investment: "Đầu tư / sinh lời", other: "Hình thức khác" };
  function rnd(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); var s = ""; for (var i = 0; i < n; i++) s += ALPHA[a[i] % 32]; return s; }
  function normCode(v) { var c = String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); if (c.indexOf("LCS") === 0) c = c.slice(3); return /^[A-HJ-NP-Z2-9]{12}$/.test(c) ? "LCS-" + c.slice(0, 4) + "-" + c.slice(4, 8) + "-" + c.slice(8) : null; }
  async function sha(t) { needCrypto(); var b = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t))); var h = ""; for (var i = 0; i < b.length; i++) h += ("0" + b[i].toString(16)).slice(-2); return h; }
  function rlist() { var a = read(RK, []); return Array.isArray(a) ? a.filter(function (r) { return r && typeof r.id === "string" && STATUS[r.status] && Array.isArray(r.events); }) : []; }
  function pubR(r) {
    var last = r.events.slice().reverse().find(function (e) { return e.to_status === r.status; });
    return { reference: r.reference, status: r.status, category: r.category, indicator_type: r.indicator_type, created_at: r.created_at, updated_at: r.updated_at,
      reason: r.status === "REJECTED" && last ? last.reason : null, steps: r.events.map(function (e) { return { status: e.to_status, at: e.created_at }; }) };
  }
  var reports = Object.freeze({
    STATUS: STATUS, CATS: CATS, normCode: normCode,
    submit: async function (p) {
      await readyP;
      if (SERVER) return call("POST", "reports", { category: p.category, indicator_type: p.indicator_type, indicator: p.indicator, description: p.description, ward: p.ward });
      var now = new Date(), iso = now.toISOString(), code = normCode(rnd(12)), list = rlist(), me = session();
      var dup = list.some(function (x) { return String(x.indicator || "").toLowerCase() === String(p.indicator).toLowerCase(); });
      var r = { id: "f02-" + Date.now().toString(36) + "-" + rnd(4).toLowerCase(), reference: code, code_hash: await sha(code), owner: me ? me.username : null,
        category: p.category, indicator_type: p.indicator_type, indicator: p.indicator, description: p.description, ward: p.ward, province: "Đồng Nai", status: "PENDING_VERIFICATION", possible_duplicate: dup, created_at: iso, updated_at: iso, has_evidence: false, events: [] };
      list.unshift(r);
      if (!write(RK, list.slice(0, 300))) throw new Error("Trình duyệt đang chặn lưu dữ liệu nên chưa lưu được báo cáo.");
      return { reference: r.reference, code: code, status: r.status, possible_duplicate: dup, owner: r.owner };
    },
    lookup: async function (codeIn) {
      await readyP;
      var code = normCode(codeIn); if (!code) throw new Error("Mã tra cứu gồm 12 ký tự sau chữ LCS, ví dụ LCS-AB2C-D3EF-GH4K.");
      if (SERVER) return (await call("POST", "lookup", { code: code })).report;
      var h = await sha(code), r = rlist().find(function (x) { return x.code_hash === h; });
      if (!r) throw new Error("Không tìm thấy báo cáo với mã này trên trình duyệt này. Kiểm tra lại từng ký tự.");
      return pubR(r);
    },
    mine: async function () {
      await readyP; var me = session(); if (!me) return [];
      if (SERVER) return (await call("GET", "myreports")).reports;
      return rlist().filter(function (x) { return x.owner === me.username; }).map(pubR);
    },
    reviewList: async function () {
      await readyP;
      if (SERVER) return (await call("GET", "review/reports")).reports;
      return rlist().map(function (r) { var x = Object.assign({}, r); delete x.code_hash; x.has_account = !!x.owner; x.reporter = x.owner ? { username: x.owner, name: (read(KA, {})[x.owner] || {}).name || x.owner } : null; delete x.owner; return x; });
    },
    decide: async function (id, b) {
      await readyP;
      if (SERVER) return (await call("POST", "review/decision", { id: id, target: b.target, reason: b.reason, evidence_basis: b.evidence_basis, evidence_checked: !!b.evidence_checked, expected_updated_at: b.expected_updated_at })).report;
      var list = rlist(), r = list.find(function (x) { return x.id === id; }); if (!r) throw new Error("Không tìm thấy hồ sơ.");
      var t = new Date().toISOString(), me = session();
      r.events.push({ actor: me ? me.username : "reviewer-demo", from_status: r.status, to_status: b.target, reason: b.reason, evidence_basis: b.evidence_basis || "", created_at: t });
      r.status = b.target; r.updated_at = t;
      if (!write(RK, list)) throw new Error("Trình duyệt đang chặn lưu dữ liệu.");
      var x = Object.assign({}, r); delete x.code_hash; x.has_account = !!x.owner; x.reporter = x.owner ? { username: x.owner, name: (read(KA, {})[x.owner] || {}).name || x.owner } : null; delete x.owner; return x;
    }
  });
  function mode() { return SERVER ? "server" : "local"; }
  function chip() {
    var s = session();
    document.querySelectorAll("[data-lcs-acct]").forEach(function (a) {
      var t = a.querySelector(".lcs-acct-t");
      if (t) t.textContent = s ? s.name : "Tài khoản";
      a.classList.toggle("in", !!s);
      a.setAttribute("aria-label", s ? "Tài khoản: " + s.name + " (" + (ROLE[s.role] || "") + ")" : "Đăng nhập hoặc tạo tài khoản");
      a.title = s ? s.name + " · " + (ROLE[s.role] || "") : "Tài khoản: đăng nhập hoặc tạo mới";
    });
  }
  function changed() { chip(); try { window.dispatchEvent(new CustomEvent("lcs:auth", { detail: session() })); } catch (e) {} }
  window.addEventListener("storage", function (e) { if (!SERVER && (e.key === KS || e.key === KA)) changed(); });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", chip); else chip();
  var readyP = SERVER ? probe() : Promise.resolve();
  window.LCS = Object.freeze({ session: session, login: login, register: register, logout: logout, contacts: contacts, saveContacts: saveContacts, mode: mode, reports: reports, ROLE: ROLE, SEED: SEED, DEMO_PW: DEMO_PW });
})();
</script>

  </svg>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>

    <main class="acct-wrap" id="main">

      <div class="notice-local"><svg class="ic" aria-hidden="true"><use href="#icon-info"></use></svg><span id="store-note"><strong>Bản demo.</strong> Tài khoản chỉ lưu trong trình duyệt này, mật khẩu được băm (PBKDF2) trước khi lưu và không gửi đi đâu. Không dùng mật khẩu thật bạn đang dùng ở nơi khác.</span></div>

<script>
var ICON=function(n){return '<svg class="ic" aria-hidden="true"><use href="#icon-'+n+'"></use></svg>'};
var esc=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
(function(){
  var root=document.getElementById("acct-root");
  var FILE={"F00": "index.html", "F01": "quick-check.html", "F02": "report.html", "F03": "ask-family.html", "F04": "learn.html", "F05": "quiz.html", "F06": "volunteer-dashboard.html", "F07": "message-check.html", "F08": "check-result.html", "F09": "trusted-contacts.html", "F12": "moderation.html", "F13": "account.html"};
  var NEXT={F00:1,F01:1,F02:1,F03:1,F04:1,F05:1,F06:1,F07:1,F08:1,F09:1,F12:1};
  var NAMES={F00:"Trang chủ",F02:"Báo cáo",F03:"Hỏi người thân",F06:"Đội tình nguyện",F09:"Người thân tin cậy",F12:"Trung tâm kiểm duyệt"};
  var next=(new URLSearchParams(location.search).get("next")||"").toUpperCase(); if(!NEXT[next]) next="";
  var tab=new URLSearchParams(location.search).get("tab")==="register"?"register":"login", busy=false, err="", fields={}, keep={};
  function go(code){location.href=FILE[code]}
  function field(id,label,type,ac,hint,extra){var e=fields[id];return '<div class="field"><label for="'+id+'">'+label+'</label><input class="input" id="'+id+'" name="'+id+'" type="'+type+'" autocomplete="'+ac+'" value="'+(type==="password"?"":esc(keep[id]||""))+'"'+(e?' aria-invalid="true" aria-describedby="'+id+'-e"':'')+(extra||"")+'/>'+(e?'<span class="err" id="'+id+'-e">'+esc(e)+'</span>':hint?'<span class="hint">'+hint+'</span>':'')+'</div>'}
  function guest(){
    var L=tab==="login";
    return '<h1>'+(L?"Đăng nhập":"Tạo tài khoản người dân")+'</h1><p class="lead">'+(next?'Đăng nhập để tiếp tục đến <strong>'+esc(NAMES[next]||next)+'</strong>.':L?"Đăng nhập để dùng danh sách người thân của bạn. Cán bộ Đoàn đăng nhập để vào trang kiểm duyệt.":"Miễn phí, chỉ cần tên hiển thị và mật khẩu. Không cần số điện thoại hay căn cước.")+'</p>'+
    '<div class="tabs" role="tablist" aria-label="Chọn cách"><button type="button" role="tab" id="tab-login" aria-selected="'+L+'" data-tab="login">Đăng nhập</button><button type="button" role="tab" id="tab-register" aria-selected="'+!L+'" data-tab="register">Tạo tài khoản</button></div>'+
    (L?'<form class="acct-form" id="f-login" novalidate>'+field("username","Tên đăng nhập","text","username","",' autocapitalize="none" spellcheck="false" maxlength="30"')+field("password","Mật khẩu","password","current-password","",' maxlength="100"')+
      '<label class="show-pw"><input type="checkbox" id="showpw"/> Hiện mật khẩu</label>'+(err?'<div class="form-alert" role="alert">'+esc(err)+'</div>':'')+
      '<button class="btn btn-primary" type="submit" '+(busy?"disabled":"")+'>'+(busy?"Đang kiểm tra…":ICON("lock")+" Đăng nhập")+'</button></form>'+
      '<div class="guest-lookup"><span class="gl-q">Không muốn tạo tài khoản?</span><span class="gl-links"><a href="report.html">'+ICON("flag")+' Gửi báo cáo ẩn danh</a><span class="gl-sep" aria-hidden="true"></span><a href="report.html?tra_cuu=1">'+ICON("search")+' Tra cứu bằng mã</a></span></div><details class="demo-box"><summary>Tài khoản cán bộ Đoàn dùng thử (demo)</summary><p style="margin:8px 0 0">Tài khoản cán bộ do Đoàn cấp, người dân không tự tạo được. Bản demo có sẵn 2 tài khoản, mật khẩu chung <code>'+esc(LCS.DEMO_PW)+'</code>:</p><ul><li><code>canbo.demo</code>: Cán bộ kiểm duyệt, vào trang Kiểm duyệt</li><li><code>tinhnguyen.demo</code>: Đội tình nguyện, vào trang Đội tình nguyện</li></ul><div class="demo-fill"><button type="button" data-fill="canbo.demo">Điền tài khoản kiểm duyệt</button><button type="button" data-fill="tinhnguyen.demo">Điền tài khoản tình nguyện</button></div></details>'
    :'<form class="acct-form" id="f-register" novalidate>'+field("name","Tên hiển thị","text","nickname","Tên người thân và cán bộ nhìn thấy, ví dụ: Cô Lan.",' maxlength="50"')+field("username","Tên đăng nhập","text","username","4–30 ký tự: chữ không dấu, số, dấu chấm hoặc gạch dưới.",' autocapitalize="none" spellcheck="false" maxlength="30"')+field("password","Mật khẩu","password","new-password","Tối thiểu 8 ký tự, có cả chữ và số. Không dùng lại mật khẩu ngân hàng.",' maxlength="100"')+field("confirm","Nhập lại mật khẩu","password","new-password","",' maxlength="100"')+
      '<label class="show-pw"><input type="checkbox" id="showpw"/> Hiện mật khẩu</label>'+(err?'<div class="form-alert" role="alert">'+esc(err)+'</div>':'')+
      '<button class="btn btn-primary" type="submit" '+(busy?"disabled":"")+'>'+(busy?"Đang tạo…":ICON("check-circle")+" Tạo tài khoản")+'</button><p class="hint" style="margin:0;font-size:13px;color:#5d667c">Tài khoản tạo ở đây là tài khoản người dân. Tài khoản cán bộ kiểm duyệt và đội tình nguyện do Đoàn cấp.</p></form>');
  }
  function card(code,icon,title,sub,go){return '<a class="feature" href="'+FILE[code]+'"><span class="f-icon">'+ICON(icon)+'</span><strong>'+title+'</strong><small>'+sub+'</small><span class="go">'+go+' '+ICON("arrow")+'</span></a>'}
  function profile(a){
    var cards=a.role==="citizen"?card("F09","users","Người thân tin cậy","Thêm, sửa số người thân để gọi nhanh khi cần.","Thiết lập")+card("F03","phone","Hỏi người thân","Gọi hoặc nhắn tin cho người thân trước khi làm theo yêu cầu lạ.","Mở")
      :a.role==="reviewer"?card("F12","eye","Trung tâm kiểm duyệt","Tiếp nhận báo cáo người dân gửi, xác minh và cập nhật trạng thái.","Vào trang")+card("F06","heart","Đội tình nguyện","Thống kê đã xác minh để chọn nội dung tuyên truyền.","Vào trang")
      :card("F06","heart","Đội tình nguyện","Thống kê đã xác minh theo khu vực, gợi ý nội dung tuyên truyền.","Vào trang")+card("F12","eye","Thống kê kiểm duyệt","Vai trò tình nguyện chỉ xem số liệu đủ ngưỡng, không xem hồ sơ gốc.","Vào trang");
    return '<h1>Xin chào, '+esc(a.name)+'</h1><div class="profile"><span class="av" aria-hidden="true">'+esc(a.name.trim().charAt(0).toUpperCase())+'</span><div><strong>'+esc(a.name)+'</strong><span class="role-pill'+(a.staff?" staff":"")+'">'+esc(a.roleLabel)+'</span> <small style="color:#5d667c">@'+esc(a.username)+'</small></div></div>'+
      (next?'<div class="form-ok" role="status">Bạn đã đăng nhập. <a href="'+FILE[next]+'" style="color:#0c6639">Tiếp tục đến '+esc(NAMES[next]||next)+' →</a></div>':'')+
      (a.staff?'':'<section class="my-reports first" id="bao-cao" aria-labelledby="mr-h"><div class="mr-head"><h2 id="mr-h">Báo cáo của tôi</h2><span class="mr-acts"><a class="btn btn-secondary" href="report.html?tra_cuu=1">'+ICON("search")+' Tra cứu bằng mã</a><a class="btn btn-secondary" href="report.html">'+ICON("flag")+' Gửi báo cáo mới</a></span></div><div id="mr-list" aria-live="polite"><p class="hint">Đang tải lịch sử báo cáo…</p></div></section>')+'<div class="feature-grid two">'+cards+'</div>'+'<div class="acct-actions"><button type="button" class="btn btn-secondary" id="logout">'+ICON("close")+' Đăng xuất</button><a class="btn btn-secondary" href="index.html">'+ICON("home")+' Về trang chủ</a></div>';
  }
  function note(){var n=document.getElementById("store-note");if(n)n.innerHTML=LCS.mode()==="server"?"<strong>Đang dùng máy chủ Lá Chắn Số.</strong> Tài khoản và người thân được lưu vào file <code>data/accounts.lcsdb</code> đã mã hóa AES-256; mật khẩu được băm (scrypt), không lưu nguyên văn. Không dùng mật khẩu thật bạn đang dùng ở nơi khác.":"<strong>Bản demo, đang mở trực tiếp file HTML.</strong> Trình duyệt không cho ghi file ra ổ đĩa nên tài khoản tạm lưu trong trình duyệt này (mật khẩu đã băm PBKDF2). Muốn lưu vào file mã hóa, chạy <code>node server.js</code> rồi mở http://localhost:8686. Không dùng mật khẩu thật bạn đang dùng ở nơi khác."}
  function when(v){var d=new Date(v);return isNaN(+d)?"":d.toLocaleString("vi-VN",{dateStyle:"short",timeStyle:"short"})}
  var mrSeq=0;
  function loadMine(){var box=document.getElementById("mr-list");if(!box)return;var seq=++mrSeq;var R=LCS.reports;
    R.mine().then(function(list){if(seq!==mrSeq)return;
      box.innerHTML=list.length?'<ul class="mr-list">'+list.map(function(r){return '<li class="mr-item st-'+esc(r.status)+'"><div class="mr-top"><strong>'+esc(R.CATS[r.category]||"Báo cáo")+'</strong><span class="mr-pill">'+esc(R.STATUS[r.status]||r.status)+'</span></div><small>Mã '+esc(r.reference)+' · gửi '+when(r.created_at)+(r.updated_at!==r.created_at?' · cập nhật '+when(r.updated_at):'')+'</small>'+(r.reason?'<div class="mr-reason"><strong>Lý do từ chối:</strong> '+esc(r.reason)+'</div>':'')+'</li>'}).join("")+'</ul>'
        :'<div class="empty-c"><strong>Chưa có báo cáo nào</strong>Báo cáo bạn gửi khi đang đăng nhập sẽ được lưu ở đây, xem trạng thái không cần nhập mã.</div>';
      if(location.hash==="#bao-cao"){var h=document.getElementById("bao-cao");if(h)h.scrollIntoView({block:"start"})}
    }).catch(function(e){if(seq===mrSeq)box.innerHTML='<div class="form-alert" role="alert">Chưa tải được lịch sử báo cáo: '+esc(e.message)+'</div>'})}
  function render(focus){note();var a=LCS.session();root.innerHTML=a?profile(a):guest();bind();if(a)loadMine();if(focus){var t=root.querySelector(focus);if(t)t.focus()}}
  function bind(){
    root.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab=b.dataset.tab;err="";fields={};render("#tab-"+tab)}});
    var sp=document.getElementById("showpw");if(sp)sp.onchange=function(){root.querySelectorAll('input[type="password"],input[data-pw]').forEach(function(i){i.type=sp.checked?"text":"password";i.setAttribute("data-pw","1")})};
    root.querySelectorAll("[data-fill]").forEach(function(b){b.onclick=function(){document.getElementById("username").value=b.dataset.fill;var p=document.getElementById("password");p.value=LCS.DEMO_PW;p.focus()}});
    var lo=document.getElementById("logout");if(lo)lo.onclick=function(){LCS.logout();tab="login";render("h1")};
    var fl=document.getElementById("f-login");if(fl)fl.onsubmit=function(e){e.preventDefault();if(busy)return;var u=fl.username.value,p=fl.password.value;keep={username:u};fields={};
      if(!u.trim())fields.username="Nhập tên đăng nhập.";if(!p)fields.password="Nhập mật khẩu.";if(fields.username||fields.password){err="";render(fields.username?"#username":"#password");return}
      busy=true;err="";render();LCS.login(u,p).then(function(){busy=false;if(next)go(next);else render("h1")}).catch(function(x){busy=false;err=x.message;render("#password")})};
    var fr=document.getElementById("f-register");if(fr)fr.onsubmit=function(e){e.preventDefault();if(busy)return;var o={name:document.getElementById("name").value,username:fr.username.value,password:fr.password.value,confirm:fr.confirm.value};keep={name:o.name,username:o.username};
      busy=true;err="";fields={};render();LCS.register(o).then(function(){busy=false;if(next)go(next);else render("h1")}).catch(function(x){busy=false;fields=x.fields||{};err=x.fields?"":x.message;var f=["name","username","password","confirm"].filter(function(k){return fields[k]})[0];render(f?"#"+f:"button[type=submit]")})};
  }
  window.addEventListener("lcs:auth",function(){if(!busy)render()});
  render();
})();
</script>
<!-- LCS cỡ chữ: nút A− / A+ đồng bộ giữa các trang qua localStorage "lcs_font_scale" -->
<link rel="stylesheet" href="css/font-size.css">
<script>
(function () {
  var s = window.__lcsFont || { L: [0.9, 1, 1.15, 1.3], i: 1 };
  var hosts = document.querySelectorAll("[data-lcs-fs]");
  var outs = [], decs = [], incs = [];
  hosts.forEach(function (host) {
    host.innerHTML = '<div class="lcs-fs" role="group" aria-label="Cỡ chữ">' +
      '<button type="button" data-d="-1" aria-label="Giảm cỡ chữ" title="Giảm cỡ chữ"><span class="lcs-fs-small">A</span>−</button>' +
      '<output aria-live="polite"></output>' +
      '<button type="button" data-d="1" aria-label="Tăng cỡ chữ" title="Tăng cỡ chữ">A+</button></div>';
    outs.push(host.querySelector("output"));
    decs.push(host.querySelector('[data-d="-1"]'));
    incs.push(host.querySelector('[data-d="1"]'));
    host.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-d]");
      if (b) set(s.i + Number(b.dataset.d), true);
    });
  });
  function layout() {
    var w = window.innerWidth / s.L[s.i];
    document.documentElement.classList.toggle("lcs-compact", w < 1140 && window.innerWidth >= 851);
    document.documentElement.classList.toggle("lcs-narrow", w < 560);
  }
  function set(i, save) {
    i = Math.max(0, Math.min(s.L.length - 1, i));
    s.i = i;
    document.documentElement.style.zoom = s.L[i];
    outs.forEach(function (o) { o.textContent = Math.round(s.L[i] * 100) + "%"; });
    decs.forEach(function (b) { b.disabled = i === 0; });
    incs.forEach(function (b) { b.disabled = i === s.L.length - 1; });
    if (save) { try { localStorage.setItem("lcs_font_scale", String(s.L[i])); } catch (e) {} }
    layout();
  }
  // Đồng bộ ngay với các tab khác đang mở
  window.addEventListener("storage", function (e) {
    if (e.key === "lcs_font_scale") { var k = s.L.indexOf(parseFloat(e.newValue)); set(k >= 0 ? k : 1, false); }
  });
  window.addEventListener("resize", layout);
  set(s.i, false);
})();
</script>
